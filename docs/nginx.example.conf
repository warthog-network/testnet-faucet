# Sample nginx server block for the testnet faucet.
#
# This is a REFERENCE. The operator's actual nginx config lives on the host,
# not in this repo. Use this as a starting point; replace SSL paths and
# upstream addresses as appropriate.
#
# Run:
#   sudo cp docs/nginx.example.conf /etc/nginx/sites-available/testnet-faucet.conf
#   sudo ln -s /etc/nginx/sites-available/testnet-faucet.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# If the host is also serving other domains, you may want a wildcard
# `server_name` and a global `set_real_ip_from` block. This file assumes
# a per-site server block.

server {
  listen 443 ssl http2;
  server_name testnet-faucet.warthog.network;

  ssl_certificate     /etc/letsencrypt/live/testnet-faucet.warthog.network/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/testnet-faucet.warthog.network/privkey.pem;

  # Trust the immediate-peer IP. Do NOT pass through a client-supplied
  # X-Forwarded-For. The faucet reads the leftmost value of this header
  # only when the peer is in the trusted range (configured by TRUST_PROXY).
  real_ip_header X-Forwarded-For;
  set_real_ip_from 127.0.0.1;            # trust nginx on the same host
  # set_real_ip_from 10.0.0.0/8;         # uncomment if nginx is on a private subnet

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
  }

}

# Optional: redirect the bare host on port 80 to https.
server {
  listen 80;
  server_name testnet-faucet.warthog.network;
  return 301 https://$host$request_uri;
}
